version: '3.8'

services:
  # The PostgreSQL Database Container
  postgres-db:
    image: postgres:15-alpine
    container_name: jubensha-postgres
    restart: always
    environment:
      POSTGRES_USER: jubensha_admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: jubensha_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
